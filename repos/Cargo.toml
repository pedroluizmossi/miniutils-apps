[package]
name = "repos"
version = "0.3.0"
description = "Git repositories: MiniUtils external app that shows what is left to commit and push"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
miniutils-app = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# local time for the end-of-day reminder (std does not know the time zone)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# changes in .git (commit, checkout, fetch) without scanning the disk: inotify on Linux,
# ReadDirectoryChangesW on Windows
notify = "8"
