[package]
name = "repos"
version = "0.2.0"
description = "Repositórios Git: app externo do MiniUtils que mostra o que falta commitar e enviar"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
miniutils-app = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# hora local para o lembrete do fim do dia (a std não sabe o fuso)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# mudanças no .git (commit, checkout, fetch) sem varrer o disco: inotify no Linux,
# ReadDirectoryChangesW no Windows
notify = "8"
