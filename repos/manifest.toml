# Repositórios Git: app externo do MiniUtils (acesso total).
# Formato: topo de src/core/plugins.rs; protocolo: topo de src/apps/external.rs (no
# repositório do MiniUtils).
id = "io.github.pedroluizmossi.repos"
name = "Repositórios"
description = "Seus repositórios Git e o que falta commitar e enviar, com enviar e puxar num clique, o agente de IA trabalhando em cada um e o CI do GitHub. A mascote cobra pendência velha e comemora quando tudo foi enviado. Funciona no Linux e no Windows (precisa do git; o CI, do gh)."
icon = "polvo"
api = 1
# as sessões do Claude Code, do Codex e do OpenCode (a pasta de cada uma), para mostrar
# o agente trabalhando no repositório
uses = ["agents"]

[app]
view = "view.slint"
linux = "bin/repos"
windows = "bin/repos.exe"
every = 30

[[settings]]
key = "stale_hours"
label = "Horas até a mascote cobrar pendências"
type = "int"
default = 24
min = 4
max = 168
step = 4

[[settings]]
key = "depth"
label = "Profundidade da busca nas pastas"
type = "int"
default = 2
min = 1
max = 4
step = 1

[[settings]]
key = "only_pending"
label = "Mostrar só repositórios com pendências"
type = "bool"
default = false

[[settings]]
key = "fetch"
label = "Buscar no remoto a cada 30 min (git fetch)"
type = "bool"
default = false

[[settings]]
key = "github"
label = "Mostrar CI e PRs do GitHub (precisa do gh com login)"
type = "bool"
default = true

[[settings]]
key = "reminder"
label = "Lembrar no fim do dia dos commits sem enviar"
type = "bool"
default = true

[[settings]]
key = "reminder_hour"
label = "Hora do lembrete"
type = "int"
default = 18
min = 12
max = 23
step = 1
