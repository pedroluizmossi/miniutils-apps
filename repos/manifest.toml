# Git repositories: a MiniUtils external app (full access).
# Format: top of src/core/plugins.rs; protocol: top of src/apps/external.rs (in the
# MiniUtils repository). name, description and labels are English; the hub translates them
# with i18n/<lang>.po.
id = "io.github.pedroluizmossi.repos"
name = "Repositories"
description = "Your Git repositories and what is left to commit and push, with one-click push and pull, the AI agent working in each one and the GitHub CI. The mascot nags about old pending work and celebrates when everything is pushed. Works on Linux and Windows (needs git; the CI needs gh)."
icon = "polvo"
api = 1
# the Claude Code, Codex and OpenCode sessions (each one's folder), to show the agent
# working in the repository
uses = ["agents"]

[app]
view = "view.slint"
linux = "bin/repos"
windows = "bin/repos.exe"
every = 30

[[settings]]
key = "stale_hours"
label = "Hours until the mascot nags about pending work"
type = "int"
default = 24
min = 4
max = 168
step = 4

[[settings]]
key = "depth"
label = "Search depth in the folders"
type = "int"
default = 2
min = 1
max = 4
step = 1

[[settings]]
key = "only_pending"
label = "Show only repositories with pending work"
type = "bool"
default = false

[[settings]]
key = "fetch"
label = "Fetch from the remote every 30 min (git fetch)"
type = "bool"
default = false

[[settings]]
key = "github"
label = "Show GitHub CI and PRs (needs gh logged in)"
type = "bool"
default = true

[[settings]]
key = "reminder"
label = "Remind me at the end of the day about unpushed commits"
type = "bool"
default = true

[[settings]]
key = "reminder_hour"
label = "Reminder time"
type = "int"
default = 18
min = 12
max = 23
step = 1
