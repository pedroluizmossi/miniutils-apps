# Release of an app: the tag `<app>-v<version>` (e.g. `repos-v0.1.0`) runs the tests, builds
# the app for Linux (static, musl: runs on any distro) and Windows, and publishes a Release
# with the executables, the SHA-256 sums and the entry ready for the store's registry.json
# (in the notes and in the file `registry-entry.json`).
#
# The executables are the only release assets: the store installs the rest of the app
# folder (manifest.toml, view.slint, i18n/*.po, …) from the commit the entry pins, and the
# executable embeds i18n/pt-BR.po for its own texts.
#
#   git tag repos-v0.1.0 && git push origin repos-v0.1.0
#
# The tag's version must match the `version` in the app's Cargo.toml. Running it by hand
# (Actions tab › Release › Run workflow) only builds, as run artifacts, without publishing.
name: Release

on:
  push:
    tags: ["*-v*"]
  workflow_dispatch:
    inputs:
      app:
        description: "App folder (e.g. repos)"
        required: true
        default: repos

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Executable ${{ matrix.os_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux
            target: x86_64-unknown-linux-musl
            ext: ""
          - runner: windows-latest
            os_name: windows
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: App and version
        id: app
        env:
          INPUT_APP: ${{ inputs.app }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            app="${GITHUB_REF_NAME%-v*}"
            tag_version="${GITHUB_REF_NAME##*-v}"
          else
            app="$INPUT_APP"
          fi
          if [[ ! -f "$app/manifest.toml" ]]; then
            echo "::error::no app in $app/ (missing $app/manifest.toml)"
            exit 1
          fi
          # `cargo pkgid` gives "…#repos@0.1.0" (or "…#0.1.0"): keep what comes after
          id=$(cargo pkgid -p "$app" --locked)
          version="${id##*[#@]}"
          if [[ -n "${tag_version:-}" && "$tag_version" != "$version" ]]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match version $version of $app/Cargo.toml"
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: musl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Tests
        run: cargo test --workspace --locked

      - name: Build (release)
        env:
          APP: ${{ steps.app.outputs.app }}
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p "$APP" --target "$TARGET"

      - name: Package
        env:
          APP: ${{ steps.app.outputs.app }}
          TARGET: ${{ matrix.target }}
          OS_NAME: ${{ matrix.os_name }}
          EXT: ${{ matrix.ext }}
        run: |
          # the name tools/index_entry.py expects
          asset="$APP-$OS_NAME-x86_64$EXT"
          mkdir -p dist
          cp "target/$TARGET/release/$APP$EXT" "dist/$asset"
          cd dist
          sha256sum "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.os_name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the Release
    needs: build
    # only on a tag; when run by hand the executables stay as artifacts
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Index entry and Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          app="${TAG%-v*}"
          version="${TAG##*-v}"
          python3 tools/index_entry.py --app "$app" --tag "$TAG" --commit "$GITHUB_SHA" \
            --repo "https://github.com/$GITHUB_REPOSITORY" --dist dist > registry-entry.json
          {
            echo "Executables of **$app $version** for Linux (static) and Windows."
            echo
            echo "To publish it in the store: add the entry below to the \`plugins\` list of"
            echo "\`registry.json\` and sign the index again (\`miniutils --store-sign\`)."
            echo
            echo '```json'
            cat registry-entry.json
            echo '```'
          } > notes.md
          ls -l dist
          gh release create "$TAG" dist/* registry-entry.json --title "$app $version" --notes-file notes.md --verify-tag
